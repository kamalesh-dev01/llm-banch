services:
  - type: web
    name: llmbench-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SCANNER_DOWNLOAD_URL
        value: https://github.com/kamalesh-io/llm-banch/releases/download/v1.1.0/LLMBench-Scanner.exe
      - key: SCANNER_SHA256
        value: 190486ec32c7ad768b12f94b72e30a84d5329dcf0827f5fa5e25fb7e27b606c8
      - key: SCANNER_SIZE_MB
        value: "31.67"
