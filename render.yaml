services:
  - type: web
    name: llmbench-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SCANNER_DOWNLOAD_URL
        value: https://github.com/kamalesh-io/llm-banch/releases/download/v1.1.0/LLMBench-Scanner.exe
      - key: SCANNER_SHA256
        value: 50e0e5fa0af19e7fdbcee2740a403a7dc68a88b13cd48a4357f3e24aa0fd3008
      - key: SCANNER_SIZE_MB
        value: "31.67"
