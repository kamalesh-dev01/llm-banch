[package]
name = "llmbench-overlay"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-ico",
  "image-png"
] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
